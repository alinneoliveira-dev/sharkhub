{% extends "base.html" %}

{% block content %}

<div class="app">

    <header class="status-bar">
    <span id="current-time">17:18</span>

    <div class="status-icons">
        <span class="signal-icon" aria-label="Sinal">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </span>

        <span class="wifi-icon" id="wifi-icon" aria-label="Wi-Fi">
            <span></span>
            <span></span>
            <span></span>
        </span>

        <span class="battery-icon" aria-label="Bateria">
            <span class="battery-level"></span>
        </span>
    </div>
</header>
    <section class="screen active" id="home-screen">
        <div class="home-header">
            <div>
                <span class="eyebrow">SEU PRÓXIMO MERGULHO</span>
                <h1>Olá, explorador<span class="accent-dot">.</span></h1>
            </div>
            <button class="round-button" aria-label="Ambiente">
                <img src="{{ url_for('static', filename='images/icon-menu.png') }}" alt="Ambiente">
            </button>
        </div>

        <article class="featured-shark">
            <div class="featured-overlay">
             <h2>O verdadeiro<br>rei dos mares.</h2>
            </div>
        </article>

        <div class="section-heading"><span>ESCOLHA SUA EXPEDIÇÃO</span></div>

        <div class="expedition-list">
            <button class="expedition-card" data-screen="species-screen">
                <span class="expedition-icon green">
                    ◉
                </span>
                <span class="expedition-text">
                    <strong>Encontros no oceano</strong>
                    <small>Espécies incríveis.</small>
                </span>
                <span class="arrow">›</span>
            </button>
            <button class="expedition-card" data-screen="quiz-screen">
                <span class="expedition-icon yellow">
                    ✓
                </span>
                <span class="expedition-text">
                    <strong>Mito ou verdade?</strong>
                    <small>Desafie o que você sabe.</small>
                </span>

                <span class="arrow">›</span>

            </button>

            <button class="expedition-card" data-screen="personality-screen">
                <span class="expedition-icon purple">
                    ✧
                </span>
                <span class="expedition-text">
                    <strong>Qual tubarão é você?</strong>
                    <small>Descubra seu lado selvagem.</small>
                </span>

                <span class="arrow">›</span>

            </button>

        </div>
    </section>
    <section class="screen" id="species-screen">
        <div class="inner-header">
            <button class="back-button" data-screen="home-screen">
                ←
            </button>
            <div>
                <span class="eyebrow">EXPLORAÇÃO</span>
                <h2>Encontros<br>no oceano.</h2>
            </div>
        </div>
        <p class="screen-description"></p>

        <div id="species-list" class="species-list">
        </div>

    </section>

    <section class="screen" id="shark-detail-screen">

        <div class="inner-header">

            <button class="back-button" data-screen="species-screen">
                ←
            </button>

            <div>
                <span class="eyebrow">ESPÉCIE</span>
                <h2 id="detail-name">Tubarão</h2>
            </div>

        </div>


        <div class="detail-image"></div>
        <div class="detail-content">
            <em id="detail-scientific-name"></em>
            <p id="detail-description"></p>
            <div class="detail-grid">
                <div>
                    <span>HABITAT</span>
                    <strong id="detail-habitat"></strong>
                </div>
                <div>
                    <span>TAMANHO</span>
                    <strong id="detail-size"></strong>
                </div>
                <div>
                    <span>ALIMENTAÇÃO</span>
                    <strong id="detail-diet"></strong>
                </div>
                <div>
                    <span>STATUS</span>
                    <strong id="detail-status"></strong>
                </div>

            </div>

        </div>

    </section>

    <section class="screen placeholder-screen" id="quiz-screen">

        <button class="back-button" data-screen="home-screen">
            ← Voltar ao oceano
        </button>
        <h2>Mito ou verdade?</h2>

    </section>

    <section class="screen placeholder-screen" id="personality-screen">

        <button class="back-button" data-screen="home-screen">
            ← Voltar ao oceano
        </button>
        <h2>Qual tubarão é você?</h2>
    </section>

    <nav class="bottom-nav">

        <button class="nav-item active" data-screen="home-screen">
            <img src="{{ url_for('static', filename='images/icon-home.png') }}" alt="Início">
        </button>

        <button class="nav-item" data-screen="species-screen">
            <img src="{{ url_for('static', filename='images/icon-shark-home.png') }}" alt="Espécies">
        </button>

        <button class="nav-item" data-screen="quiz-screen">
            <img src="{{ url_for('static', filename='images/icon-quiz.png') }}" alt="Quiz">
        </button>

        <button class="nav-item" data-screen="personality-screen">
            <img src="{{ url_for('static', filename='images/icon-sparkles.png') }}" alt="Personalidade">
        </button>

    </nav>

</div>

{% endblock %}
